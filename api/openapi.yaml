components:
  schemas:
    Bar:
      additionalProperties: false
      properties:
        c:
          format: double
          type: number
        h:
          format: double
          type: number
        l:
          format: double
          type: number
        o:
          format: double
          type: number
        rev:
          description: Revision; a correction has a higher one.
          format: int32
          maximum: 32767
          minimum: -32768
          type: integer
        t:
          description: Open time, Unix ms.
          format: int64
          type: integer
        v:
          format: double
          type: number
      required:
        - t
        - o
        - h
        - l
        - c
        - v
        - rev
      type: object
    CandlePage:
      additionalProperties: false
      properties:
        bars:
          description: "Closed bars, oldest first: the newest ones in the range, up to limit."
          items:
            $ref: "#/components/schemas/Bar"
          type: array
        historyComplete:
          description: Whether no bars exist before the first one returned.
          type: boolean
        nextTo:
          description: The to of the next older page, when the range has more bars.
          format: int64
          type: integer
      required:
        - bars
        - historyComplete
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    Problem:
      additionalProperties: false
      properties:
        detail:
          type: string
        errors:
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          description: Stable identifier of the problem; clients branch on it, never on title or detail.
          enum:
            - about:blank
            - urn:wickframe:problem:bad-request
            - urn:wickframe:problem:not-found
            - urn:wickframe:problem:validation-error
            - urn:wickframe:problem:internal-error
          type: string
      required:
        - type
        - title
        - status
      type: object
info:
  title: Wickframe API
  version: "1"
openapi: 3.1.0
paths:
  /api/v1/candles:
    get:
      description: Returns stored closed bars, paged backwards in time with nextTo.
      operationId: getCandles
      parameters:
        - description: Instrument key, such as binance:BTCUSDT.
          explode: false
          in: query
          name: instrument
          required: true
          schema:
            description: Instrument key, such as binance:BTCUSDT.
            examples:
              - fake:DEMO
            type: string
        - description: Timeframe.
          explode: false
          in: query
          name: tf
          required: true
          schema:
            description: Timeframe.
            enum:
              - 1m
              - 3m
              - 5m
              - 15m
              - 30m
              - 1h
              - 2h
              - 4h
              - 6h
              - 12h
              - 1D
              - 1W
              - 1M
            type: string
        - description: Oldest open time to include, Unix ms.
          explode: false
          in: query
          name: from
          schema:
            description: Oldest open time to include, Unix ms.
            format: int64
            minimum: 0
            type: integer
        - description: Newest open time to include, Unix ms. Defaults to the newest bar.
          explode: false
          in: query
          name: to
          schema:
            description: Newest open time to include, Unix ms. Defaults to the newest bar.
            format: int64
            minimum: 0
            type: integer
        - description: Maximum number of bars.
          explode: false
          in: query
          name: limit
          schema:
            default: 2000
            description: Maximum number of bars.
            format: int64
            maximum: 5000
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandlePage"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      summary: Candle history
      tags:
        - Candles
